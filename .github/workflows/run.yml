name: Compile ruleset

on:
  push:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
  
permissions:
  contents: write
  actions: write

jobs:
  sync_and_compile:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6
      
    - name: Fetch and compile sing-box rules from ruleset
      run: |
        set -Eeuo pipefail
        git remote add ruleset https://github.com/SukkaLab/ruleset.skk.moe.git
        git fetch ruleset
        git checkout ruleset/master -- sing-box
        rm -rf domainset ip non_ip
        mv sing-box/* ./

        find domainset ip non_ip -type f -name "my_*.json" -exec rm -f {} \;

        find . -type f -name "*.json" -exec bash -c '
          jq "
            walk(
              if type == \"array\" then 
                map(select(
                  (type != \"string\") or ((. | test(\"skk\\\\.moe\"; \"i\")) | not)
                ))
              else 
                . 
              end
            ) | 
            walk(
              if type == \"object\" then 
                with_entries(select(.value != [] and .value != null))
              else 
                . 
              end
            )
            | .version = 5
          " "$1" > "$1.tmp" && mv "$1.tmp" "$1"
        ' _ {} \;

    - name: Commit and push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail
        rm -rf .git
        git config --global init.defaultBranch main
        git init
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git commit --allow-empty-message --no-edit
        git remote add origin https://github-action:$GITHUB_TOKEN@github.com/${{ github.repository }}.git
        git push origin main --force
    
    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 3
        keep_minimum_runs: 1
